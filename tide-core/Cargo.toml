[package]
name = "tide-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "no_std harmonic tide prediction + rendering core, shared by the Pi daemon and the nRF52840 firmware"

[dependencies]
# Portable float math so the harmonic synthesis runs identically on host and on
# thumbv7em (no std). libm builds everywhere.
libm = "0.2"

[features]
default = []

[dev-dependencies]
# Validation/precision studies run on the host and use std. Spirix drives the
# width sweep that confirms the tunable-precision numeric type (target F5E3)
# holds through the real harmonic sum.
spirix = { path = "../../spirix" }
