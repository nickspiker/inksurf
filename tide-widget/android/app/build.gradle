apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Same versioning as photon: versionName = the Cargo.toml crate version verbatim; versionCode = git commit count (Android's private monotonic "is this newer?" gate, meaningless otherwise).
def cargoVersion = {
    def toml = new File(rootDir, "../Cargo.toml")
    def m = (toml.text =~ /(?m)^version\s*=\s*"([^"]+)"/)
    if (!m) { throw new GradleException("Could not read version from ${toml} — the APK version must track Cargo.toml") }
    return m[0][1]
}()
def gitCommitCount = {
    def out = new ByteArrayOutputStream()
    def rc = exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
        workingDir rootDir
        standardOutput = out
        ignoreExitValue = true
    }
    if (rc.exitValue != 0) { throw new GradleException("git rev-list failed — versionCode is the commit count; the build must run inside the git repo") }
    return out.toString().trim().toInteger()
}()

android {
    namespace 'com.inksurf.tide'
    compileSdk 35

    defaultConfig {
        applicationId "com.inksurf.tide"
        minSdk 26
        targetSdk 35
        versionCode gitCommitCount
        versionName cargoVersion

        // ARM64 only
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Release signs with the canonical TOKEN key, like every one of Nick's Android apps (shared deterministic per-device ANDROID_ID). build.sh release resolves the keystore + password from the keys dir; a release build without them fails loud rather than producing a wrongly-signed APK. Debug builds never need them.
    def tokenKsPath = System.getenv("TOKEN_KEYSTORE_PATH")
    def tokenKsPass = System.getenv("TOKEN_KEYSTORE_PASSWORD")
    def wantsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if (wantsRelease && (!tokenKsPath || !tokenKsPass)) {
        throw new GradleException("Release signing requires TOKEN_KEYSTORE_PATH and TOKEN_KEYSTORE_PASSWORD (the canonical 'token' key). Build with ./build.sh release.")
    }
    signingConfigs {
        release {
            if (tokenKsPath && tokenKsPass) {
                storeFile file(tokenKsPath)
                storePassword tokenKsPass
                keyAlias System.getenv("TOKEN_KEY_ALIAS") ?: "token"
                keyPassword System.getenv("TOKEN_KEY_PASSWORD") ?: tokenKsPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (tokenKsPath && tokenKsPass) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // libtide_widget.so lands here from `cargo ndk -o` (see ../build.sh).
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
