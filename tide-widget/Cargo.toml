[package]
name = "tide-widget"
version = "0.1.0"
edition = "2021"
publish = false
description = "Android home-screen tide widget: the panel's tide chart in full colour and anti-aliased, behind a thin Kotlin/JNI bridge"

[lib]
# cdylib = libtide_widget.so for the APK; rlib so the host preview example can link the renderer.
crate-type = ["cdylib", "rlib"]

[dependencies]
tide-core = { path = "../tide-core" }
libm = "0.2"
# Coverage only: anti-aliased path rasterization into an 8-bit mask (glyph outlines, curves). Compositing is fluor-style `under()` (see render.rs).
tiny-skia = "0.11"
# Glyph outlines from the dozenal font (Oxanium+glyphs, U+0010..U+001B).
ttf-parser = "0.25"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
png = "0.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
