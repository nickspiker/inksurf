[package]
name = "tideglyph-push"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-side BLE pusher for the tideglyph device: transfer tests now, signed OTA images later"

[dependencies]
anyhow = "1"
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
uuid = "1"
blake3 = "1"
