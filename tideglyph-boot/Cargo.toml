[package]
name = "tideglyph-boot"
version = "0.1.0"
edition = "2021"
publish = false
description = "embassy-boot A/B second-stage bootloader for the tideglyph tide clock — runs at 0x1000 under the stock UF2 bootloader, swaps DFU->ACTIVE with power-fail safety + WDT trial-boot revert"

# Pinned to the exact embassy rev the upstream nrf bootloader example builds
# against (embassy-nrf 0.11 + embassy-boot-nrf 0.12, mutually compatible). This
# is a SEPARATE binary from tideglyph-fw; they share only the flash partition
# addresses (linker symbols), never code, so the version need not match the app.
[dependencies]
embassy-nrf = { git = "https://github.com/embassy-rs/embassy", rev = "c5f6524804fa160999aed88aaa94e274c15993ef", features = ["nrf52840"] }
embassy-boot-nrf = { git = "https://github.com/embassy-rs/embassy", rev = "c5f6524804fa160999aed88aaa94e274c15993ef" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "c5f6524804fa160999aed88aaa94e274c15993ef" }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
cfg-if = "1"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
